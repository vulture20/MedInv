; GitHub issue #168: php:8.4-fpm-alpine's stock upload_max_filesize (2M) and
; post_max_size (8M) were never overridden anywhere in this project before
; this file — confirmed live against a real deployment (`php -i` inside the
; running container) after a user reported a genuine upload failure. A real
; backup .zip (BackupService::upload(), GitHub issue #167) commonly runs
; 15-20MB+ once a collection has enough cover images, so almost every real
; upload silently exceeded both defaults; a request over post_max_size makes
; PHP drop $_FILES/$_POST entirely rather than erroring cleanly, which is
; what turned into an otherwise-confusing 500 downstream. This same limit
; also silently applied to POST /admin/import (ExportImportController,
; briefing 9.1) the whole time — nothing here is specific to the backup
; upload endpoint, so fixing it here fixes both.
;
; A "#"-style comment (tried first) broke PHP's ini parser outright
; ("syntax error, unexpected '('", confirmed live against this very file —
; php.ini only reliably supports ";" as a comment character, not "#") and
; silently left every additional .ini file unparsed, this one included —
; not merely a cosmetic mistake.
;
; 512M leaves real headroom for a large collection's worth of cover images
; while still being a real ceiling, not "unlimited" (0), for what is an
; authenticated admin-only endpoint but still a web-facing one. Kept in
; lock-step with nginx.conf.template's own client_max_body_size, which would
; otherwise reject a large request before it ever reached PHP.
upload_max_filesize = 512M
post_max_size = 512M
