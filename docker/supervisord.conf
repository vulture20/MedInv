[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; nginx (SPA static files + reverse proxy to php-fpm for /api, /sanctum)
; and php-fpm (Laravel) run as siblings in one container — this is the
; single application container from briefing 10./19. ("Betrieb im
; Docker-Container"); the chosen database backend runs separately (compose).
[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; This image has no system cron daemon — Laravel's scheduler (routes/console.php,
; e.g. the automatic-backup task from briefing 9.2 / GitHub issue #27) only ever
; fires anything if `php artisan schedule:run` is actually invoked periodically.
; This is the standard "poor man's cron" loop for a Dockerized Laravel app:
; schedule:run itself only *acts* on tasks that are actually due (per-minute
; resolution), so calling it every 60s here is the full interval Laravel's
; scheduler supports, not a busy-loop.
;
; --whisper (a built-in schedule:run flag, not a custom one) suppresses only
; Laravel's own "No scheduled commands are ready to run." line, printed on
; every one of the ~1439 idle minutes/day where nothing was due — real task
; output ("Running [name] .. DONE", and anything logged via onFailure())
; still prints normally. Combined with routes/console.php's schedules now
; deferring their due/enabled checks into ->when() filters instead of
; running-then-no-op'ing inside the closure body, this container's log only
; gains a line when the scheduler actually did something, not once a minute
; regardless.
[program:scheduler]
command=sh -c "while true; do php /var/www/backend/artisan schedule:run --no-interaction --whisper >> /dev/stdout 2>&1; sleep 60; done"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; Laravel's own application log (Log::info()/Log::debug()/... — login
; activity, admin actions, outbound/inbound request logging, etc., see
; config/logging.php's 'single'/'daily' channels) writes to
; storage/logs/laravel.log, a plain file — never to php-fpm's own
; stdout/stderr above, so none of it used to show up in `docker logs`,
; only inside the file itself (still readable directly, e.g. `docker
; compose exec app tail -f storage/logs/laravel.log`, or from the
; persisted `storage` volume). This mirrors that file onto the
; container's own stdout too, so `docker logs` shows it as well, without
; changing where Laravel itself writes — the file remains the source of
; truth. `-F` (not `-f`) keeps retrying if the file doesn't exist yet (a
; fresh install's first request) instead of exiting once and never
; picking it up; `-n 0` skips printing the file's existing backlog so a
; container restart doesn't re-dump everything logged since install.
[program:laravel-log]
command=tail -F -n 0 /var/www/backend/storage/logs/laravel.log
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
