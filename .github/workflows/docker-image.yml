name: Docker Image Build

# Builds docker/Dockerfile (the single image that bundles backend + frontend,
# see CLAUDE.md's "Two apps, one deployable image" section) and publishes it
# to the GitHub Container Registry (ghcr.io) — no external registry account
# or secrets needed, GITHUB_TOKEN is enough.
#
# Tag scheme: every push to main produces a `nightly` image (plus
# `main`/`sha-<short>`), tracking unreleased tip-of-main. Pushing a real
# version tag (e.g. `v0.7`, matching
# backend/config/medinv.php's own two-component version format — see that
# file's docblock for why there's deliberately no third/patch component)
# additionally produces a numbered image tag (`0.7`) *and* `latest`, via
# docker/metadata-action's default `flavor.latest=auto` behavior, which
# auto-attaches `latest` to any `type=match`-derived tag. `latest` therefore
# always tracks whichever version tag was most recently pushed — not a
# registry-queried "highest" version, so version tags should be pushed in
# ascending order for `latest` to stay meaningful.
on:
  push:
    branches: ["main"]
    # "v*.*" (not "v*.*.*"): this project's version tags are two-component
    # (v0.7, not v0.7.0), matching medinv.php's own format — a wildcard glob
    # still matches an occasional three-component tag too, since "*" can
    # itself absorb an extra ".".
    tags: ["v*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # allows manually re-running a build from the Actions tab
    inputs:
      ref:
        description: >-
          Git tag/branch/SHA to build, using today's tagging logic (this
          input) rather than whatever tagging logic was committed at that
          ref — a workflow run always otherwise executes the workflow file
          as it existed at its trigger ref, so a plain re-dispatch against
          an old release tag would silently rebuild with that tag's own,
          possibly outdated, workflow definition instead. Useful for
          backfilling/rebuilding an older release (e.g. "v0.7") against the
          current tag scheme. Leave empty to build whatever ref triggered
          this run, as normal.
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # ghcr.io requires a lowercase image name; github.repository ("vulture20/MedInv")
  # keeps the repo's actual casing, so it's lowercased in a separate step below
  # rather than used directly here.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # inputs.ref only has a value for a manual dispatch that set it
          # (see the workflow_dispatch.inputs.ref description above);
          # otherwise this checks out github.ref exactly as before.
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # full history/tags, needed for metadata-action's context: git below to resolve which tag is checked out

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped for pull_request builds (no push permission on PRs from forks) —
      # the build itself still runs above to catch breakage before merging.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          # "git" (rather than the default "workflow") re-derives ref/sha
          # from the actual checked-out repository state instead of
          # github.ref — needed so the manual `ref` input above (and its
          # detached-HEAD checkout of an arbitrary historical tag) is what
          # gets tagged. Only switched on for that manual-ref case, so the
          # ordinary push-to-main/tag-push paths keep the exact behavior
          # they had before this input existed.
          context: ${{ inputs.ref && 'git' || 'workflow' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=v(.*),group=1
            type=sha,prefix=
            type=raw,value=nightly,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: . # repo root — docker/Dockerfile expects to COPY backend/ and frontend/ from here
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Uncomment to also publish arm64 images (e.g. Raspberry Pi) — roughly
          # doubles build time since amd64 CI runners cross-compile via QEMU:
          # platforms: linux/amd64,linux/arm64
